name: Create Release
run-name: Create release for ${{ github.event.client_payload.version }}

on:
    # The real trigger
    repository_dispatch:
        types:
            - craftcms/new-release

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write # Required to create tags/releases
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ github.event.client_payload.tag }}
                  fetch-depth: 0

            # 1. Setup Environment
            - uses: pnpm/action-setup@v6.0.10
              with:
                  version: 11.22.0
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version: 24.14.1
                  cache: pnpm
                  cache-dependency-path: frontend/pnpm-lock.yaml

            # 2. Build the Frontend
            - name: Build frontend assets
              run: |
                  cd frontend
                  pnpm install
                  pnpm build

            # 3. Commit the Assets
            - name: Commit Build Artifacts to Tag
              run: |
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "actions@github.com"

                  TAG_NAME="${{ github.event.client_payload.tag }}"

                  # Force add the built files (from your vite config path)
                  git add -f src/assetbundles/altpilotfrontend/dist

                  # Commit
                  git commit -m "Build assets for $TAG_NAME"

                  # Update/Create the tag
                  git tag -f $TAG_NAME
                  git push origin $TAG_NAME --force

            # 4. Create the Release
            - uses: ncipollo/release-action@v1.21.0
              with:
                  body: ${{ github.event.client_payload.notes }}
                  makeLatest: ${{ github.event.client_payload.latest }}
                  name: ${{ github.event.client_payload.version }}
                  prerelease: ${{ github.event.client_payload.prerelease }}
                  tag: ${{ github.event.client_payload.tag }}
